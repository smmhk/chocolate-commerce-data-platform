id: check_python_environment
namespace: chocolate

tasks:
  - id: check_project_files
    type: io.kestra.plugin.scripts.python.Script

    containerImage: python:3.14.0-slim

    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      networkMode: chocolate-commerce-data-platform_default
      volumes:
        - "/run/desktop/mnt/host/c/Users/smmhk/PycharmProjects/chocolate-commerce-data-platform:/project:ro"

    script: |
      from pathlib import Path

      project_dir = Path("/project")

      required_files = [
          "src/pipelines/ingestion/online/load_tables_to_postgres.py",
          "data/raw/products_export.csv",
          "requirements.txt",
      ]

      for filename in required_files:
          file_path = project_dir / filename

          if not file_path.is_file():
              raise FileNotFoundError(
                  f"파일을 찾을 수 없습니다: {file_path}"
              )

          print(f"[FOUND] {file_path}")

      print("[DONE] Project file access check")