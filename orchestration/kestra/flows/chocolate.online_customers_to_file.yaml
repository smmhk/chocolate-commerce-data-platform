id: online_customers_to_file
namespace: chocolate

tasks:
  - id: export_customers
    type: io.kestra.plugin.scripts.python.Commands
    containerImage: python:3.14.0-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      networkMode: chocolate-commerce-data-platform_default
      volumes:
        - "/run/desktop/mnt/host/c/Users/smmhk/PycharmProjects/chocolate-commerce-data-platform:/project:ro"
    env:
      CHOCOLATE_DB_HOST: postgres
      PYTHONDONTWRITEBYTECODE: "1"
      PIPELINE_ORCHESTRATOR: kestra
      PIPELINE_RUN_ID: "{{ execution.id }}"
    beforeCommands:
      - pip install -r /project/requirements.txt
    commands:
      - >-
        cd /project &&
        python -m src.pipelines.export.online.export_customers_to_csv
        --output-dir "$WORKING_DIR"
    outputFiles:
      - "customers_*.csv"

  - id: upload_customers_to_gcs
    type: io.kestra.plugin.gcp.gcs.Upload
    serviceAccount: "{{ secret('GCP_SERVICE_ACCOUNT') }}"
    from: "{{ outputs.export_customers.outputFiles | jq('.[]') | first }}"
    to: "gs://mandy-chocolate-raw-2026/raw_online/customers/{{ execution.id }}/customers.csv"

  - id: load_customers_to_bigquery
    type: io.kestra.plugin.gcp.bigquery.Query
    projectId: chocolate-data-platform
    location: us-east1
    serviceAccount: "{{ secret('GCP_SERVICE_ACCOUNT') }}"
    sql: |
      LOAD DATA OVERWRITE `chocolate-data-platform.raw_online.customers`
      (
        id STRING,
        customer_number STRING,
        user_id STRING,
        email STRING,
        first_name STRING,
        last_name STRING,
        phone STRING,
        customer_type STRING,
        square_customer_id STRING,
        created_at TIMESTAMP,
        updated_at TIMESTAMP,
        signup_channel STRING,
        square_sync_status STRING,
        square_synced_at TIMESTAMP,
        square_sync_error STRING,
        ingested_at TIMESTAMP,
        orchestrator STRING,
        pipeline_run_id STRING
      )
      FROM FILES (
        format = 'CSV',
        uris = ['gs://mandy-chocolate-raw-2026/raw_online/customers/{{ execution.id }}/customers.csv'],
        skip_leading_rows = 1,
        null_marker = r'\N',
        allow_quoted_newlines = TRUE,
        max_bad_records = 0
      );

  - id: validate_customers
    type: io.kestra.plugin.scripts.python.Commands
    containerImage: python:3.14.0-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      networkMode: chocolate-commerce-data-platform_default
      volumes:
        - "/run/desktop/mnt/host/c/Users/smmhk/PycharmProjects/chocolate-commerce-data-platform:/project:ro"
    inputFiles:
      gcp-key.json: "{{ secret('GCP_SERVICE_ACCOUNT') }}"
    env:
      GCS_SOURCE_URI: "gs://mandy-chocolate-raw-2026/raw_online/customers/{{ execution.id }}/customers.csv"
      PYTHONDONTWRITEBYTECODE: "1"
      PIPELINE_ORCHESTRATOR: kestra
      PIPELINE_RUN_ID: "{{ execution.id }}"
    beforeCommands:
      - pip install -r /project/requirements.txt
    commands:
      - |
        set -e
        test -s "$WORKING_DIR/gcp-key.json"
        export GOOGLE_APPLICATION_CREDENTIALS="$WORKING_DIR/gcp-key.json"

        cd /project
        python -m src.pipelines.validation.online.validate_customers_in_bigquery \
          --gcs-uri "$GCS_SOURCE_URI"
