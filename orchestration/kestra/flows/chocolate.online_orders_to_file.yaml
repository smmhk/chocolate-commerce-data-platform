id: online_orders_to_file
namespace: chocolate

tasks:
  - id: export_orders
    type: io.kestra.plugin.scripts.python.Commands
    containerImage: python:3.14.0-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      networkMode: chocolate-commerce-data-platform_default
      volumes:
        - "/run/desktop/mnt/host/c/Users/smmhk/PycharmProjects/chocolate-commerce-data-platform:/project:ro"
    env:
      CHOCOLATE_DB_HOST: postgres
      PYTHONDONTWRITEBYTECODE: "1"
      PIPELINE_ORCHESTRATOR: kestra
      PIPELINE_RUN_ID: "{{ execution.id }}"
    beforeCommands:
      - pip install -r /project/requirements.txt
    commands:
      - >-
        cd /project &&
        python -m src.pipelines.export.online.export_orders_to_csv
        --output-dir "$WORKING_DIR"
    outputFiles:
      - "orders_*.csv"

  - id: upload_orders_to_gcs
    type: io.kestra.plugin.gcp.gcs.Upload
    serviceAccount: "{{ secret('GCP_SERVICE_ACCOUNT') }}"
    from: "{{ outputs.export_orders.outputFiles | jq('.[]') | first }}"
    to: "gs://mandy-chocolate-raw-2026/raw_online/orders/{{ execution.id }}/orders.csv"

  - id: load_orders_to_bigquery
    type: io.kestra.plugin.gcp.bigquery.Query
    projectId: chocolate-data-platform
    location: us-east1
    serviceAccount: "{{ secret('GCP_SERVICE_ACCOUNT') }}"
    sql: |
      LOAD DATA OVERWRITE `chocolate-data-platform.raw_online.orders`
      (
        id STRING,
        order_id STRING,
        channel STRING,
        store_id STRING,
        customer_id STRING,
        customer_type STRING,
        contact_first_name STRING,
        contact_last_name STRING,
        contact_email STRING,
        contact_phone STRING,
        shipping_address_line1 STRING,
        shipping_address_line2 STRING,
        shipping_city STRING,
        shipping_province STRING,
        shipping_postal_code STRING,
        shipping_country STRING,
        order_status STRING,
        subtotal NUMERIC,
        discount_type STRING,
        discount_amount NUMERIC,
        discount_reason STRING,
        tax_rate NUMERIC,
        tax_amount NUMERIC,
        shipping_amount NUMERIC,
        total_amount NUMERIC,
        payment_method STRING,
        item_count INT64,
        created_at TIMESTAMP,
        completed_at TIMESTAMP,
        square_order_id STRING,
        square_customer_id STRING,
        square_location_id STRING,
        square_sync_status STRING,
        square_synced_at TIMESTAMP,
        square_sync_error STRING,
        ingested_at TIMESTAMP,
        orchestrator STRING,
        pipeline_run_id STRING
      )
      FROM FILES (
        format = 'CSV',
        uris = ['gs://mandy-chocolate-raw-2026/raw_online/orders/{{ execution.id }}/orders.csv'],
        skip_leading_rows = 1,
        null_marker = r'\N',
        allow_quoted_newlines = TRUE,
        max_bad_records = 0
      );

  - id: validate_orders
    type: io.kestra.plugin.scripts.python.Commands
    containerImage: python:3.14.0-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      networkMode: chocolate-commerce-data-platform_default
      volumes:
        - "/run/desktop/mnt/host/c/Users/smmhk/PycharmProjects/chocolate-commerce-data-platform:/project:ro"
    inputFiles:
      gcp-key.json: "{{ secret('GCP_SERVICE_ACCOUNT') }}"
    env:
      GCS_SOURCE_URI: "gs://mandy-chocolate-raw-2026/raw_online/orders/{{ execution.id }}/orders.csv"
      PYTHONDONTWRITEBYTECODE: "1"
      PIPELINE_ORCHESTRATOR: kestra
      PIPELINE_RUN_ID: "{{ execution.id }}"
    beforeCommands:
      - pip install -r /project/requirements.txt
    commands:
      - |
        set -e
        test -s "$WORKING_DIR/gcp-key.json"
        export GOOGLE_APPLICATION_CREDENTIALS="$WORKING_DIR/gcp-key.json"

        cd /project
        python -m src.pipelines.validation.online.validate_orders_in_bigquery \
          --gcs-uri "$GCS_SOURCE_URI"
