id: online_order_items_to_file
namespace: chocolate

tasks:
  - id: export_order_items
    type: io.kestra.plugin.scripts.python.Commands
    containerImage: python:3.14.0-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      networkMode: chocolate-commerce-data-platform_default
      volumes:
        - "/run/desktop/mnt/host/c/Users/smmhk/PycharmProjects/chocolate-commerce-data-platform:/project:ro"
    env:
      CHOCOLATE_DB_HOST: postgres
      PYTHONDONTWRITEBYTECODE: "1"
      PIPELINE_ORCHESTRATOR: kestra
      PIPELINE_RUN_ID: "{{ execution.id }}"
    beforeCommands:
      - pip install -r /project/requirements.txt
    commands:
      - >-
        cd /project &&
        python -m src.pipelines.export.online.export_order_items_to_csv
        --output-dir "$WORKING_DIR"
    outputFiles:
      - "order_items_*.csv"

  - id: upload_order_items_to_gcs
    type: io.kestra.plugin.gcp.gcs.Upload
    serviceAccount: "{{ secret('GCP_SERVICE_ACCOUNT') }}"
    from: "{{ outputs.export_order_items.outputFiles | jq('.[]') | first }}"
    to: "gs://mandy-chocolate-raw-2026/raw_online/order_items/{{ execution.id }}/order_items.csv"

  - id: load_order_items_to_bigquery
    type: io.kestra.plugin.gcp.bigquery.Query
    projectId: chocolate-data-platform
    location: us-east1
    serviceAccount: "{{ secret('GCP_SERVICE_ACCOUNT') }}"
    sql: |
      LOAD DATA OVERWRITE `chocolate-data-platform.raw_online.order_items`
      (
        id STRING,
        order_id STRING,
        store_id STRING,
        product_id STRING,
        sku STRING,
        product_name STRING,
        category STRING,
        quantity INT64,
        unit_price NUMERIC,
        discount_amount NUMERIC,
        line_total NUMERIC,
        square_catalog_object_id STRING,
        created_at TIMESTAMP,
        square_line_item_uid STRING,
        ingested_at TIMESTAMP,
        orchestrator STRING,
        pipeline_run_id STRING
      )
      FROM FILES (
        format = 'CSV',
        uris = ['gs://mandy-chocolate-raw-2026/raw_online/order_items/{{ execution.id }}/order_items.csv'],
        skip_leading_rows = 1,
        null_marker = r'\N',
        allow_quoted_newlines = TRUE,
        max_bad_records = 0
      );

  - id: validate_order_items
    type: io.kestra.plugin.scripts.python.Commands
    containerImage: python:3.14.0-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      networkMode: chocolate-commerce-data-platform_default
      volumes:
        - "/run/desktop/mnt/host/c/Users/smmhk/PycharmProjects/chocolate-commerce-data-platform:/project:ro"
    inputFiles:
      gcp-key.json: "{{ secret('GCP_SERVICE_ACCOUNT') }}"
    env:
      GCS_SOURCE_URI: "gs://mandy-chocolate-raw-2026/raw_online/order_items/{{ execution.id }}/order_items.csv"
      PYTHONDONTWRITEBYTECODE: "1"
      PIPELINE_ORCHESTRATOR: kestra
      PIPELINE_RUN_ID: "{{ execution.id }}"
    beforeCommands:
      - pip install -r /project/requirements.txt
    commands:
      - |
        set -e
        test -s "$WORKING_DIR/gcp-key.json"
        export GOOGLE_APPLICATION_CREDENTIALS="$WORKING_DIR/gcp-key.json"

        cd /project
        python -m src.pipelines.validation.online.validate_order_items_in_bigquery \
          --gcs-uri "$GCS_SOURCE_URI"
