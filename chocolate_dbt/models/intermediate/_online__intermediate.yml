
version: 2

models:
  - name: int_online_order_items_enriched
    description: >
      Online order line items enriched with
      order and product information.
      Grain: one row per order line item.

    columns:
      - name: order_item_id
        description: Unique order line item identifier.
        data_tests:
          - unique
          - not_null

      - name: order_id
        description: Online business order identifier.
        data_tests:
          - not_null

      - name: product_id
        description: Online business product identifier.
        data_tests:
          - not_null
