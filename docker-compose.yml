services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: chocolate
      POSTGRES_PASSWORD: ${CHOCOLATE_DB_PASSWORD}
      POSTGRES_DB: chocolate_db
    ports:
      - "5432:5432"
    volumes:
      - chocolate_postgres_data:/var/lib/postgresql

  kestra_postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: kestra
      POSTGRES_USER: kestra
      POSTGRES_PASSWORD: k3str4
    volumes:
      - kestra_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 30s
      timeout: 10s
      retries: 10

  kestra:
    image: kestra/kestra:v1.1
    pull_policy: always
    user: "root"
    command: server standalone
    ports:
      - "8080:8080"
      - "8081:8081"
    volumes:
      - kestra_data:/app/storage
      - kestra_tmp:/tmp/kestra-wd
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      KESTRA_CONFIGURATION: |
        datasources:
          postgres:
            url: jdbc:postgresql://kestra_postgres:5432/kestra
            driverClassName: org.postgresql.Driver
            username: kestra
            password: k3str4

        kestra:
          plugins:
            configurations:
              - type: io.kestra.plugin.scripts.runner.docker.Docker
                values:
                  volume-enabled: true

          server:
            basicAuth:
              username: "admin@kestra.io"
              password: "Admin1234!"

          repository:
            type: postgres

          storage:
            type: local
            local:
              basePath: "/app/storage"

          queue:
            type: postgres

          tasks:
            tmpDir:
              path: /tmp/kestra-wd/tmp

          url: http://localhost:8080/

    depends_on:
      kestra_postgres:
        condition: service_healthy

volumes:
  chocolate_postgres_data:
  kestra_postgres_data:
  kestra_data:
  kestra_tmp:
